name: lorkarium

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lorkarium
      POSTGRES_PASSWORD: lorkarium
      POSTGRES_DB: lorkarium
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lorkarium']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
