<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lorkarium</title>
  </head>
  <body>
    <main class="splash">
      <svg class="splash-mark" viewBox="0 0 120 120" aria-hidden="true">
        <g
          transform="translate(60 60) scale(0.78) translate(-60 -56)"
          fill="none"
          stroke="currentColor"
          stroke-linejoin="round"
          stroke-linecap="round"
          stroke-width="6"
        >
          <path d="M60 12 L77 43 L60 100 L43 43 Z" />
          <path d="M27 48 L41 58 L48 84 L30 66 Z" />
          <path d="M93 48 L79 58 L72 84 L90 66 Z" />
        </g>
      </svg>
      <p class="splash-brand">Lorkarium</p>
      <div class="splash-status" role="status" aria-live="polite">
        <h1 id="splash-title" class="splash-title"></h1>
        <p id="splash-detail" class="splash-detail" hidden></p>
      </div>
      <div
        id="splash-bar"
        class="splash-bar"
        role="progressbar"
        aria-label="Progresso da atualização"
        aria-valuemin="0"
        aria-valuemax="100"
        hidden
      >
        <div id="splash-fill" class="splash-fill"></div>
      </div>
      <button id="splash-retry" class="splash-retry" type="button" hidden>Tentar de novo</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
