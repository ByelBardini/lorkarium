name: Sugerir uma melhoria
description: Uma ideia de recurso ou de mudança no Lorkarium.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve
      description: O que acontece na sua mesa hoje e por que incomoda.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: A sua ideia
      description: Como você imagina que funcionaria.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas que você já tentou
