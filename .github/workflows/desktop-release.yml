name: Desktop release

# Every push to main that touches the Windows shell publishes a new release. Client and server
# changes need none: the shell opens the deployed site. The landing reads the latest release from
# the GitHub API in the browser, so it offers the new installer without a rebuild.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      # Creates the tag and the GitHub release and uploads the installer, its .sig and latest.json.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse the placeholder updater key
        shell: bash
        run: |
          if grep -q 'SUBSTITUA_PELA_CHAVE_PUBLICA' desktop/src-tauri/tauri.conf.json; then
            echo "plugins.updater.pubkey ainda é o marcador; cole a chave pública do tauri signer (docs/context/desktop.md)"
            exit 1
          fi

      # The updater only installs a higher version: major.minor come from desktop/package.json and
      # the patch is this workflow's run number, which only grows. Written for the build only, never committed.
      - name: Stamp the release version
        id: version
        shell: bash
        run: |
          base=$(node -p "require('./desktop/package.json').version.split('.').slice(0, 2).join('.')")
          version="${base}.${GITHUB_RUN_NUMBER}"
          node -e "const fs = require('fs'); const file = 'desktop/package.json'; const pkg = JSON.parse(fs.readFileSync(file, 'utf8')); pkg.version = process.argv[1]; fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');" "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release desktop-v${version}"

      - uses: ./.github/actions/setup

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read by src-tauri/build.rs at compile time; a release build refuses it absent or without https.
          LORKARIUM_APP_URL: ${{ vars.LORKARIUM_APP_URL }}
        with:
          projectPath: desktop
          tauriScript: pnpm tauri
          tagName: desktop-v${{ steps.version.outputs.version }}
          releaseName: Lorkarium para Windows ${{ steps.version.outputs.version }}
          releaseBody: Instale o Lorkarium_${{ steps.version.outputs.version }}_x64-setup.exe. Quem já tem o app recebe esta versão sozinho ao abrir.
          releaseDraft: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
