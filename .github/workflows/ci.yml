name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR makes the old run useless; on main every commit keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Skill driver self-tests
        run: |
          node .claude/skills/testar/autoteste.mjs
          node .claude/skills/refatorar/autoteste.mjs
          node .claude/skills/desenvolver-server/autoteste.mjs
      - name: Audit production dependencies
        # Informative: a transitive advisory must not block every PR until upstream ships a fix.
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

  test-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-packages
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  test-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:client
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-client
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-server
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lorkarium
          POSTGRES_PASSWORD: lorkarium
          POSTGRES_DB: lorkarium
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U lorkarium"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://lorkarium:lorkarium@localhost:5432/lorkarium
      S3_ENDPOINT: http://localhost:8333
      S3_BUCKET: lorkarium
      S3_ACCESS_KEY_ID: lorkarium
      S3_SECRET_ACCESS_KEY: lorkarium-dev-secret
      # Dev-only field-encryption key (server/.env.example); the CI databases are thrown away.
      DATA_ENCRYPTION_KEY: EJ0VAPvnCxgUGYKDbckfwbxEca0bm7NndOkKfFJQjeQ=
      # The SMTP adapter spec delivers to the Mailpit step and reads it back through its API.
      MAILPIT_SMTP_URL: smtp://localhost:1025
      MAILPIT_API_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/seaweedfs
      - uses: ./.github/actions/mailpit
      - run: pnpm db:migrate
      - run: pnpm test:integration

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build

  e2e:
    name: e2e (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One red group must not cancel the others: each report tells something different.
      fail-fast: false
      matrix:
        # The projects of e2e/playwright.config.ts (SPEC_GROUPS); the config refuses an ungrouped spec.
        group: [table, tokens, scene, combat, vision, lighting, library, account, backoffice]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lorkarium
          POSTGRES_PASSWORD: lorkarium
          POSTGRES_DB: lorkarium
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U lorkarium"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://lorkarium:lorkarium@localhost:5432/lorkarium
      # Throwaway admin for the disposable database: the server seeds it at boot and the home e2e signs in with it.
      ADMIN_EMAIL: e2e-admin@lorkarium.dev
      ADMIN_PASSWORD: e2e-admin-password
      S3_ENDPOINT: http://localhost:8333
      S3_BUCKET: lorkarium
      S3_ACCESS_KEY_ID: lorkarium
      S3_SECRET_ACCESS_KEY: lorkarium-dev-secret
      # Dev-only field-encryption key (server/.env.example); the CI databases are thrown away.
      DATA_ENCRYPTION_KEY: EJ0VAPvnCxgUGYKDbckfwbxEca0bm7NndOkKfFJQjeQ=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/seaweedfs
      # No database step: the e2e webServer creates, migrates, empties and seeds <db>_e2e itself.
      # No browser cache: --with-deps installs the OS libraries on every run anyway (Playwright docs).
      - run: pnpm e2e:install
      - run: pnpm test:e2e --project=${{ matrix.group }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.group }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            desktop:
              - 'desktop/**'
      # The splash's TypeScript is already covered by quality and test-packages; this job is the Rust only.
      - if: steps.changes.outputs.desktop == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - if: steps.changes.outputs.desktop == 'true'
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # The only required check in the branch protection of main: a new job only needs to join `needs`.
  ci-ok:
    if: always()
    needs: [quality, test-packages, test-client, test-server, test-integration, build, e2e, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
