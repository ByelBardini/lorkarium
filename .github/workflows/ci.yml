name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR makes the old run useless; on main every commit keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Skill driver self-tests
        run: |
          node .claude/skills/testar/autoteste.mjs
          node .claude/skills/refatorar/autoteste.mjs
          node .claude/skills/desenvolver-server/autoteste.mjs
      - name: Audit production dependencies
        # Informative: a transitive advisory must not block every PR until upstream ships a fix.
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

  test-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-packages
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  test-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:client
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-client
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-server
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lorkarium
          POSTGRES_PASSWORD: lorkarium
          POSTGRES_DB: lorkarium
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U lorkarium"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://lorkarium:lorkarium@localhost:5432/lorkarium
      S3_ENDPOINT: http://localhost:8333
      S3_BUCKET: lorkarium
      S3_ACCESS_KEY_ID: lorkarium
      S3_SECRET_ACCESS_KEY: lorkarium-dev-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/seaweedfs
      - run: pnpm db:migrate
      - run: pnpm test:integration

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lorkarium
          POSTGRES_PASSWORD: lorkarium
          POSTGRES_DB: lorkarium
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U lorkarium"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://lorkarium:lorkarium@localhost:5432/lorkarium
      # Throwaway admin for the disposable database: the server seeds it at boot and the home e2e signs in with it.
      ADMIN_EMAIL: e2e-admin@lorkarium.dev
      ADMIN_PASSWORD: e2e-admin-password
      S3_ENDPOINT: http://localhost:8333
      S3_BUCKET: lorkarium
      S3_ACCESS_KEY_ID: lorkarium
      S3_SECRET_ACCESS_KEY: lorkarium-dev-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/seaweedfs
      # No database step: the e2e webServer creates, migrates, empties and seeds <db>_e2e itself.
      # No browser cache: --with-deps installs the OS libraries on every run anyway (Playwright docs).
      - run: pnpm e2e:install
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The only required check in the branch protection of main: a new job only needs to join `needs`.
  ci-ok:
    if: always()
    needs: [quality, test-packages, test-client, test-server, test-integration, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
